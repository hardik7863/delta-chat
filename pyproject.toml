[project]
name = "delta-chat"
version = "0.1.0"
description = "Document revision delta + grounded chat for engineering drawings (P&IDs)"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pdf2image>=1.17",
    "pillow>=10.0",
]

[project.optional-dependencies]
scanned = ["paddleocr>=2.7", "pytesseract>=0.3.10"]
dwg = ["ezdxf>=1.3"]

[project.scripts]
delta-chat = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
